<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A birthday surprise</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Caveat:wght@500;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a0f3a;--fg:#fff3ea;--accent:#ffb347;--card:rgba(255,255,255,.08);--paper:#fbf1e2;--ink:#3b2a20;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;transition:background .8s}
body.light{background:#fbf3ea;color:#5a3b3b}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;opacity:0;pointer-events:none;transition:opacity .7s;background:radial-gradient(ellipse at 50% 100%,#8a2f6b55,transparent 60%)}
body.light .scr{background:none}
.scr.on{opacity:1;pointer-events:auto}
h1,h2{font-family:Fraunces,Georgia,serif}
h2{font-size:1.5rem}
.small{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
.btn{border:0;border-radius:99px;padding:14px 34px;font:600 1rem Inter,sans-serif;color:#3b1a1a;background:linear-gradient(90deg,#ff9a76,#ffc371);cursor:pointer;box-shadow:0 8px 24px #ff9a7655}
.hide{visibility:hidden}
#heart{font-size:84px;cursor:grab;touch-action:none;user-select:none;filter:drop-shadow(0 8px 20px #ff5c8a88);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.hint{font-size:.7rem;letter-spacing:.25em;opacity:.55}
#tree{width:min(340px,80vw);height:300px}
.hb{font:700 2rem Caveat,cursive;color:#d6336c}
.cake{font-size:96px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
#reasons{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.r{padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid #ffb34766;box-shadow:0 0 18px #ffb34722;text-align:left;font-weight:600;font-size:.95rem;opacity:0;transform:translateY(14px);transition:.6s}
.r.in{opacity:1;transform:none}
.r b{display:block;font-size:.6rem;letter-spacing:.15em;color:var(--accent);margin-bottom:3px}
#deck{position:relative;width:min(280px,72vw);height:340px;touch-action:pan-y}
.pol{position:absolute;inset:0;background:#fff;padding:12px 12px 44px;border-radius:6px;box-shadow:0 14px 34px #0008;transition:transform .5s,opacity .5s;color:#444}
.pol .ph{width:100%;height:100%;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:.8rem;background-size:cover;background-position:center 25%;color:#0009}
.pol span{position:absolute;bottom:10px;left:0;right:0;font:700 1.1rem Caveat,cursive}
.letter{width:min(360px,100%);min-height:280px;background:var(--paper);color:var(--ink);border-radius:8px;padding:22px;text-align:left;font:500 1.15rem/1.5 Caveat,cursive;box-shadow:0 20px 50px #0007;white-space:pre-wrap}
.big{font-size:clamp(2.4rem,11vw,4rem);line-height:1.05;text-shadow:0 0 30px #ffb34788}
.big em{display:block;color:var(--accent);font-style:italic}
.ghost{background:none;border:1px solid #fff6;color:var(--fg);box-shadow:none}
</style>
</head>

 for(let i=0;i<n;i++){const a=Math.random()*6.28,s=(fw?2+Math.random()*4:1+Math.random()*7);
  P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(fw?0:4),g:fw?.06:.15,l:fw?70:110,c:cols[i%6],s:fw?2.5:5})}}
(function loop(){cx.clearRect(0,0,W,H);P=P.filter(p=>p.l>0);
 for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l--;cx.globalAlpha=Math.min(1,p.l/30);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)}
 requestAnimationFrame(loop)})();
function show(html,light){document.body.classList.toggle("light",!!light);
 app.querySelectorAll(".scr").forEach(e=>e.classList.remove("on"));
 const d=document.createElement("section");d.className="scr";d.innerHTML=html;app.appendChild(d);
 requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add("on")));return d}
const nextOn=(el,fn)=>el.addEventListener("click",fn,{once:true});

// 1. pull & release heart
function s1(){const d=show(`<div class="small">a little something, for you</div><div id="heart">❤️</div><div class="hint">PULL &amp; RELEASE</div>`,1);
 const h=$("#heart",d);let y0=null,dy=0;
 h.onpointerdown=e=>{y0=e.clientY;h.setPointerCapture(e.pointerId);h.style.transition="none"};
 h.onpointermove=e=>{if(y0==null)return;dy=Math.max(0,Math.min(160,e.clientY-y0));h.style.transform=`translateY(${dy}px) scale(${1+dy/400})`};
 h.onpointerup=()=>{if(y0==null)return;const go=dy>50;y0=null;h.style.transition="";h.style.transform="translateY(-260px) scale(.6)";dy=0;if(go){burst(W/2,H/2,50);setTimeout(s2,700)}else h.style.transform=""}}

// 2. heart tree
async function s2(){const d=show(`<svg id="tree" viewBox="0 0 300 300"><g stroke="#5b3a2e" stroke-width="5" fill="none" stroke-linecap="round"><path d="M150 290V170"/><path d="M150 190C110 170 60 130 60 80"/><path d="M150 190C190 170 240 130 240 80"/><path d="M150 170C140 130 100 100 90 60"/><path d="M150 170C160 130 200 100 210 60"/></g><g id="hs"></g></svg><div class="hb hide" id="hb">Happy Birthday,<br>${CFG.to}</div><button class="btn hide" id="nx">Next 🎁</button>`,1);
 const g=$("#hs",d),ns="http://www.w3.org/2000/svg";
 for(let i=0;i<70;i++){await wait(45);const t=Math.random()*6.28,r=Math.sqrt(Math.random());
  const x=150+Math.sin(t)**3*95*r,y=100-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*4.2*r;
  const e=document.createElementNS(ns,"text");e.setAttribute("x",x);e.setAttribute("y",y+30);e.setAttribute("font-size",10+Math.random()*10);e.textContent=["💗","🧡","💖","🌸"][i%4];g.appendChild(e)}
 $("#hb",d).classList.remove("hide");await wait(900);const b=$("#nx",d);b.classList.remove("hide");b.onclick=s3}

// 3. cake
async function s3(){let d=show(`<h2>First things first 🎂</h2><div class="small">Baking something sweet…</div>`);
 await wait(1800);d=show(`<h2>First things first 🎂</h2><div class="cake">🎂</div><div class="hb" style="color:var(--accent)">Happy Birthday, ${CFG.to}!</div><div class="small">tap anywhere to continue</div>`);
 burst(W/2,H/2,120);setTimeout(()=>burst(W/3,H/3,60),400);await wait(600);nextOn(d,s4)}

// 4. reasons
async function s4(){const d=show(`<h2>Reasons I love you</h2><div id="reasons">${CFG.reasons.map((t,i)=>`<div class="r"><b>REASON NO.${i+1} 💘</b>${t}</div>`).join("")}</div><button class="btn hide">Continue</button>`);
 for(const r of d.querySelectorAll(".r")){await wait(750);r.classList.add("in")}
 const b=$(".btn",d);b.classList.remove("hide");b.onclick=s5}

// 5. memory lane
function s5(){const cols=["#ffd6e0,#ffb3c6","#ffe5b4,#ffc38b","#d6e6ff,#a9c7ff","#e3d6ff,#c2a6ff","#d3f5e6,#9be3c4"];
 const d=show(`<h2>A walk down memory lane</h2><div class="small">swipe through</div><div id="deck"></div><button class="btn">Keep going</button>`);
 const deck=$("#deck",d);let i=0;const cards=CFG.captions.map((c,k)=>{const p=document.createElement("div");p.className="pol";
  const im=CFG.photos[k];p.innerHTML=`<div class="ph" style="background-image:${im?`url(${im})`:`linear-gradient(135deg,${cols[k%5]})`}">${im?"":"📷"}</div><span>${c}</span>`;
  p.style.transform=`rotate(${(k%2?1:-1)*(2+k)}deg)`;p.style.zIndex=99-k;
  deck.appendChild(p);return p});
 const nx=()=>{if(i<cards.length-1){cards[i].style.transform="translateX(140%) rotate(20deg)";cards[i].style.opacity=0;i++}};
 let sx=null;deck.onpointerdown=e=>sx=e.clientX;deck.onpointerup=e=>{if(sx!=null&&Math.abs(e.clientX-sx)>40)nx();sx=null};
 deck.addEventListener("wheel",e=>{if(Math.abs(e.deltaX)>20)nx()},{passive:true});
 $(".btn",d).onclick=s6}

// 6. letter
async function s6(){const d=show(`<div class="letter" id="lt"></div><button class="btn hide">Continue</button>`);
 const el=$("#lt",d);for(const ch of CFG.letter){el.textContent+=ch;await wait(ch=="\n"?160:42)}
 const b=$(".btn",d);b.classList.remove("hide");b.onclick=s7}

// 7. finale
function s7(){const d=show(`<h1 class="big">HAPPY<br>BIRTHDAY<em>${CFG.to}!</em></h1><div>Made with love, just for you — <b style="color:var(--accent)">${CFG.from}</b> 💛</div><button class="btn ghost">Replay the preview ↻</button>`);
 const iv=setInterval(()=>burst(80+Math.random()*(W-160),80+Math.random()*H*.5,45,1),650);
 $(".btn",d).onclick=()=>{clearInterval(iv);s1()}}

s1();
</script>
</body>
</html>
